[package]
name = "cpumon"
version = "0.1.0"
edition = "2024"
description = "A lightweight, real-time per-core CPU usage monitor"
repository = "https://github.com/arghyadipchak/cpumon"
license = "AGPL-3.0-or-later"
keywords = ["cli", "cpu", "monitor", "performance", "system"]
categories = ["command-line-utilities", "hardware-support"]

[package.metadata.deb]
maintainer = "Arghyadip Chakraborty <https://github.com/arghyadipchak/cpumon>"
copyright = "2026 Arghyadip Chakraborty"
license-file = ["LICENSE", "4"]
extended-description = "A lightweight, real-time per-core CPU usage monitor"
section = "utils"
priority = "optional"
assets = [
  ["target/release/cpumon", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/cpumon/README.md", "644"],
  ["completions/cpumon.bash", "usr/share/bash-completion/completions/cpumon", "644"],
  ["completions/_cpumon", "usr/share/zsh/vendor-completions/_cpumon", "644"],
  ["completions/cpumon.fish", "usr/share/fish/vendor_completions.d/cpumon.fish", "644"],
]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.6", features = ["color", "derive"] }
core_affinity = "0.8.3"
ctrlc = "3.5.2"
duration-string = "0.5.3"
sysinfo = "0.39.6"
thiserror = "2.0.20"

[build-dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6"
duration-string = "0.5.3"
sysinfo = "0.39.6"
thiserror = "2.0.20"

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
