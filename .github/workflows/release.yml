name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release-notes:
    name: Create Release Notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          args: --latest
        env:
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release notes
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}

  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb: true
            cross: false
          - target: x86_64-unknown-linux-musl
            deb: false
            cross: false
          - target: aarch64-unknown-linux-gnu
            deb: true
            cross: true
          - target: aarch64-unknown-linux-musl
            deb: false
            cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl') && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Install cargo-deb
        if: matrix.deb
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package release asset
        run: |
          ARCHIVE_NAME="cpumon-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"

          cp "target/${{ matrix.target }}/release/cpumon" README.md LICENSE "${ARCHIVE_NAME}/"
          cp -r completions "${ARCHIVE_NAME}/"

          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

          if [ "${{ matrix.deb }}" = "true" ]; then
            cargo deb --target ${{ matrix.target }} --no-build
          fi

      - name: Upload release artifact
        uses: softprops/action-gh-release@v3
        with:
          files: |
            cpumon-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/debian/*.deb
