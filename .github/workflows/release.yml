name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: x86_64-unknown-linux-musl
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          - target: aarch64-unknown-linux-musl
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl') && !matrix.use_cross
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package release asset
        run: |
          TAG_NAME="${{ github.ref_name }}"
          ARCHIVE_NAME="cpumon-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_NAME}"

          cp "target/${{ matrix.target }}/release/cpumon" README.md LICENSE "${ARCHIVE_NAME}/"
          cp -r completions "${ARCHIVE_NAME}/"

          tar -czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"

      - name: Upload release artifact
        uses: softprops/action-gh-release@v3
        with:
          files: cpumon-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
          generate_release_notes: true
